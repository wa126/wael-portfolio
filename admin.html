<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>لوحة تعديل البورتفوليو</title>
<style>body{font:16px/1.6 system-ui,Tahoma,sans-serif;background:#0b1624;color:#eef3f8;margin:0;padding:20px;max-width:860px;margin:auto}
button,.b{background:#2dd4bf;color:#06201c;border:0;border-radius:8px;padding:8px 14px;font:inherit;font-weight:700;cursor:pointer}
button.g{background:none;color:#eef3f8;border:1px solid #1f3550}button.r{background:#f87171}
.tabs,.bar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.tabs .on{outline:3px solid #fff}
details{background:#101f33;border:1px solid #1f3550;border-radius:12px;margin:12px 0;padding:12px 16px}summary{cursor:pointer;font-weight:700}
label{display:block;margin:10px 0;color:#a9b8c9}input,textarea{width:100%;background:#0b1624;color:#eef3f8;border:1px solid #1f3550;border-radius:8px;padding:8px;font:inherit;margin-top:4px}
.th{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}figure{margin:0;width:150px}figure img{width:100%;border-radius:8px}figure button{width:100%;margin-top:4px;padding:4px;font-size:13px}
.note{background:#101f33;border-right:4px solid #2dd4bf;padding:10px 14px;border-radius:8px}</style></head><body>
<h1>لوحة تعديل البورتفوليو</h1>
<p class="note">1) عدّل أو أضف مشاريعك وصورك هنا. 2) اضغط «تحميل التحديث». 3) فك الضغط وارفع الملفات (data.js ومجلد assets) على GitHub داخل المستودع واختر Commit. الصفحة دي لا تحفظ على الإنترنت، هي بتجهز الملفات فقط.</p>
<div class="tabs"><button class="g on" data-t="P">المشاريع</button><button class="g" data-t="C">الشهادات</button></div>
<div id="list"></div>
<div class="bar"><button data-act="add">+ إضافة</button><button id="exp">تحميل التحديث (zip)</button></div>
<script src="data.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const cl=o=>JSON.parse(JSON.stringify(o)),$=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let P=cl(PROJECTS),C=cl(CERTS),tab="P",cur=-1,n=0;const NEW={},src=p=>NEW[p]?NEW[p].url:p,arr=()=>tab=="P"?P:C;
const F=(f,lab,v,o={})=>`<label>${lab}${o.ta?`<textarea rows="4" dir="auto" data-f="${f}" ${o.a?"data-a=1":""}>${esc(v)}</textarea>`:`<input dir="auto" value="${esc(v)}" data-f="${f}">`}</label>`;
function imgs(o,i){const g=tab=="P"?o.gallery:[o.img].filter(Boolean);
return `<div class="th">${g.map((p,j)=>`<figure><img src="${esc(src(p))}" alt=""><button class="r" data-act="rm" data-i="${i}" data-j="${j}">حذف</button>${tab=="P"?`<button class="g" data-act="cover" data-i="${i}" data-j="${j}">${o.img==p?"✔ الغلاف":"اجعلها غلاف"}</button>`:""}</figure>`).join("")}</div>
<label>رفع صور (يتم تصغيرها تلقائياً)<input type="file" accept="image/*" ${tab=="P"?"multiple":""} data-up data-i="${i}"></label>`}
function render(){document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t==tab));
$("#list").innerHTML=arr().map((o,i)=>`<details data-i="${i}" ${i==cur?"open":""}><summary>${esc(o.title)||"بدون عنوان"}</summary>`+(tab=="P"?
F("title","العنوان",o.title)+F("desc","الوصف",o.desc,{ta:1})+F("tools","الأدوات (سطر لكل أداة)",o.tools.join("\n"),{ta:1,a:1})+F("features","المميزات (سطر لكل ميزة)",o.features.join("\n"),{ta:1,a:1})+F("questions","الأسئلة التحليلية (سطر لكل سؤال)",o.questions.join("\n"),{ta:1,a:1})+F("status","الحالة (اختياري)",o.status)+F("links.live","رابط الداشبورد المباشر",o.links.live)+F("links.linkedin","رابط بوست LinkedIn",o.links.linkedin)+F("links.file","رابط تحميل الملف",o.links.file)+F("links.github","رابط GitHub",o.links.github)
:F("title","اسم الشهادة",o.title)+F("org","الجهة",o.org)+F("date","التاريخ",o.date)+F("link","رابط التحقق (اختياري)",o.link))+imgs(o,i)+
`<div class="bar"><button class="g" data-act="up" data-i="${i}">↑</button><button class="g" data-act="dn" data-i="${i}">↓</button><button class="r" data-act="del" data-i="${i}">حذف</button></div></details>`).join("")}
document.addEventListener("input",e=>{const t=e.target,d=t.closest("details");if(!t.dataset.f||!d)return;let o=arr()[d.dataset.i],k=t.dataset.f.split("."),l=k.pop();k.forEach(x=>o=o[x]);o[l]=t.dataset.a?t.value.split("\n").map(s=>s.trim()).filter(Boolean):t.value});
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.t){tab=b.dataset.t;cur=-1;return render()}
const a=b.dataset.act,i=+b.dataset.i,j=+b.dataset.j,A=arr(),o=A[i];if(!a)return;
if(a=="add"){A.push(tab=="P"?{id:"p"+Date.now(),title:"مشروع جديد",tools:[],img:"",desc:"",features:[],questions:[],status:"",gallery:[],links:{live:"",linkedin:"",file:"",github:""}}:{title:"شهادة جديدة",org:"",date:"",img:"",link:""});cur=A.length-1}
else if(a=="del"){if(!confirm("متأكد من الحذف؟"))return;A.splice(i,1);cur=-1}
else if(a=="up"&&i>0){[A[i-1],A[i]]=[A[i],A[i-1]];cur=i-1}else if(a=="dn"&&i<A.length-1){[A[i+1],A[i]]=[A[i],A[i+1]];cur=i+1}
else if(a=="rm"){cur=i;if(tab=="P"){const p=o.gallery.splice(j,1)[0];if(o.img==p)o.img=o.gallery[0]||""}else o.img=""}
else if(a=="cover"){cur=i;o.img=o.gallery[j]}render()});
document.addEventListener("change",async e=>{const t=e.target;if(!t.dataset.up)return;const i=+t.dataset.i,o=arr()[i];
for(const f of t.files){const bm=await createImageBitmap(f),s=Math.min(1,1400/Math.max(bm.width,bm.height)),c=document.createElement("canvas");c.width=bm.width*s;c.height=bm.height*s;c.getContext("2d").drawImage(bm,0,0,c.width,c.height);
const blob=await new Promise(r=>c.toBlob(r,"image/webp",.82)),p=`assets/up-${Date.now()}-${n++}.webp`;NEW[p]={blob,url:URL.createObjectURL(blob)};
if(tab=="P"){o.gallery.push(p);if(!o.img)o.img=p}else o.img=p}cur=i;render()});
$("#exp").onclick=async()=>{const z=new JSZip();z.file("data.js","// ===== EDIT YOUR CONTENT HERE =====\nconst PROJECTS = "+JSON.stringify(P,null,1)+";\nconst CERTS = "+JSON.stringify(C,null,1)+";\n");
const used=JSON.stringify([P,C]);for(const k in NEW)if(used.includes(k))z.file(k,NEW[k].blob);
const a=document.createElement("a");a.href=URL.createObjectURL(await z.generateAsync({type:"blob"}));a.download="portfolio-update.zip";a.click()};
render();
</script></body></html>
